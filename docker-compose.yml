services:
  # ===== BASE DE DONNÉES AIRFLOW =====
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # ===== ORCHESTRATION AIRFLOW =====
  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'Europe/Paris'
      _PIP_ADDITIONAL_REQUIREMENTS: 'sentence-transformers==2.2.2 qdrant-client==1.6.4 langchain==0.1.20 langchain-community==0.0.38 langchain-text-splitters==0.0.1 pypdf==3.17.1 minio==7.2.0 huggingface_hub==0.24.5 transformers==4.30.2'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      _PIP_ADDITIONAL_REQUIREMENTS: 'sentence-transformers==2.2.2 qdrant-client==1.6.4 langchain==0.1.20 langchain-community==0.0.38 langchain-text-splitters==0.0.1 pypdf==3.17.1 minio==7.2.0 huggingface_hub==0.24.5 transformers==4.30.2'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    command: scheduler
    networks:
      - rag-network

  # ===== VECTOR DB =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - rag-network

  # ===== STOCKAGE OBJET =====
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network
  
  # ==== LLM LOCAL =====
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - rag-network
  
  # ===== API RAG =====
  api-rag:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-rag
    depends_on:
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=mistral
      - COLLECTION_NAME=documents
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - PYTHONUNBUFFERED=1
    networks:
      - rag-network
    restart: unless-stopped

  # ===== INTERFACE STREAMLIT =====
  ui-streamlit:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui-streamlit
    depends_on:
      - api-rag
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app
    environment:
      - API_URL=http://api-rag:8000
      - PYTHONUNBUFFERED=1
    networks:
      - rag-network
    restart: unless-stopped
    

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data: